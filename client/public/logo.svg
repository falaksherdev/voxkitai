<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Tailwind CSS bg-gradient-to-r from-purple-500 (#a855f7) to-emerald-500 (#10b981) -->
    <linearGradient id="voxkit-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Subtle inner drop shadow for depth -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Circular Gradient Background -->
  <circle cx="250" cy="250" r="230" fill="url(#voxkit-gradient)" />

  <!-- Foreground Icon/Monogram (Pure White) -->
  <g fill="#FFFFFF" filter="url(#shadow)">
    <!-- Letter V -->
    <path d="M 125 160 
             L 170 160 
             L 210 285 
             L 250 160 
             L 290 160 
             L 230 340 
             L 190 340 Z" />

    <!-- Soundwave / Audio Element inside 'K' -->
    <path d="M 295 160 
             L 330 160 
             L 330 230 
             L 375 160 
             L 420 160 
             L 365 242 
             L 425 340 
             L 380 340 
             L 330 258 
             L 330 340 
             L 295 340 Z" />

    <!-- Modern Voice Wave Central Accent Dot -->
    <circle cx="250" cy="325" r="10" />
  </g>
</svg>
